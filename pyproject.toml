[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "voice-scheduler"
version = "0.1.0"
description = "Local voice assistant with Chainlit UI and Pipecat pipeline"
requires-python = ">=3.11,<3.12"
dependencies = [
    # Web API
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "websockets>=12.0",
    "python-multipart>=0.0.9",
    # Text-to-speech (female voice)
    "TTS>=0.22.0",
    # Speech-to-text (local Whisper)
    "faster-whisper>=1.0.0",
    # Local audio utilities / diagnostics
    "sounddevice>=0.4.6",
    # Numerics (audio processing)
    "numpy>=1.24.0",
    # Environment variable loading
    "python-dotenv>=1.0.0",
    # HTTP client for Ollama (used via OpenAI-compat endpoint)
    "openai>=1.0.0",
    # Audio file handling for integration tests
    "scipy>=1.11.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
