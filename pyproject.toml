[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "voice-fairy"
version = "0.1.0"
description = "Voice mock-interview agent (FastAPI + WebRTC, OpenAI GPT-Live, FAISS)"
requires-python = ">=3.11,<3.12"
dependencies = [
    # Web API
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    # websockets range set by openai[realtime] (GPT-Live sideband)
    "websockets>=13,<16",
    "python-multipart>=0.0.9",
    # Numerics (vector index)
    "numpy>=1.24.0",
    # Environment variable loading
    "python-dotenv>=1.0.0",
    # OpenAI: GPT-Live voice sessions, Responses API (question writer, evaluator), embeddings
    "openai[realtime]>=3.19.2",
    # HTTP client: live session creation, key check
    "httpx>=0.27.0",
    # Vector index for reference-material retrieval (RAG)
    "faiss-cpu>=1.8.0",
    # Document text extraction (resume + reference material)
    "pypdf>=4.0.0",
    "python-docx>=1.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: needs a real OPENAI_API_KEY; deselect with -m 'not integration'",
]
