services:

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: voice-fairy-backend
    # All models are OpenAI services (no local models, no Ollama). The API key comes from
    # src/.env, which is never copied into the image.
    env_file:
      - src/.env
    environment:
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - LOG_LEVEL=INFO
      - INTERVIEWS_DIR=/app/interviews
    volumes:
      # Interview transcripts and reports outlive the container (FR-022).
      - ./interviews:/app/interviews
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: voice-fairy-frontend
    depends_on:
      - backend
    ports:
      - "80:80"
    restart: unless-stopped
